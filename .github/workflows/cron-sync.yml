name: Scheduled Background Email Sync

on:
  schedule:
    # Run every 15 minutes automatically
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  cron-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Ping NeoTrack Sync API
        run: |
          if [ -n "${{ secrets.CRON_SECRET }}" ]; then
            curl -s -X GET "https://neopat-tracker.vercel.app/api/cron/sync" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
          else
            curl -s -X GET "https://neopat-tracker.vercel.app/api/cron/sync"
          fi
