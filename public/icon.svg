<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Radial Void with Deep Emerald Atmosphere -->
    <radialGradient id="wmoBgGrad" cx="50%" cy="36%" r="72%">
      <stop offset="0%" stop-color="#0e291e" />
      <stop offset="48%" stop-color="#090e13" />
      <stop offset="100%" stop-color="#020305" />
    </radialGradient>

    <!-- Specular Rim Gradient -->
    <linearGradient id="wmoRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.9" />
      <stop offset="28%" stop-color="#10b981" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#047857" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>

    <!-- Emerald Primary Wing Gradient -->
    <linearGradient id="wmoWingLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="35%" stop-color="#2dd4bf" />
      <stop offset="70%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="wmoWingRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="35%" stop-color="#34d399" />
      <stop offset="70%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>

    <!-- Center Bridge Gradient -->
    <linearGradient id="wmoCenterBridge" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Radar Sweep Gradient -->
    <linearGradient id="wmoRadarSweep" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0" />
      <stop offset="80%" stop-color="#10b981" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.32" />
    </linearGradient>

    <!-- Specular Inlay Glow -->
    <filter id="wmoMasterBloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="wmoBeaconBloom" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="tight" />
      <feGaussianBlur stdDeviation="20" result="wide" />
      <feMerge>
        <feMergeNode in="wide" />
        <feMergeNode in="tight" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base with Precision Border -->
  <rect x="10" y="10" width="492" height="492" rx="124" fill="url(#wmoBgGrad)" />
  <rect x="10" y="10" width="492" height="492" rx="124" fill="none" stroke="url(#wmoRimGrad)" stroke-width="2.5" />

  <!-- Radar Telemetry Grid -->
  <g opacity="0.65">
    <!-- Outer Scope Ring -->
    <circle cx="256" cy="256" r="192" fill="none" stroke="#10b981" stroke-width="1.8" stroke-dasharray="6 8" stroke-opacity="0.3" />
    <!-- Mid Scope Ring -->
    <circle cx="256" cy="256" r="132" fill="none" stroke="#10b981" stroke-width="1.4" stroke-opacity="0.22" />
    <!-- Inner Telemetry Ring -->
    <circle cx="256" cy="256" r="74" fill="none" stroke="#10b981" stroke-width="1.2" stroke-dasharray="4 6" stroke-opacity="0.2" />

    <!-- Radar Sweep Sector (Upper Right Quadrant) -->
    <path d="M 256 256 L 416 148 A 192 192 0 0 0 316 70 Z" fill="url(#wmoRadarSweep)" />
    <!-- Leading Sweep Ray -->
    <line x1="256" y1="256" x2="416" y2="148" stroke="#6ee7b7" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.85" />

    <!-- Cardinal Scope Ticks -->
    <line x1="256" y1="46" x2="256" y2="70" stroke="#34d399" stroke-width="3.2" stroke-linecap="round" stroke-opacity="0.8" />
    <line x1="256" y1="442" x2="256" y2="466" stroke="#34d399" stroke-width="3.2" stroke-linecap="round" stroke-opacity="0.8" />
    <line x1="46" y1="256" x2="70" y2="256" stroke="#34d399" stroke-width="3.2" stroke-linecap="round" stroke-opacity="0.8" />
    <line x1="442" y1="256" x2="466" y2="256" stroke="#34d399" stroke-width="3.2" stroke-linecap="round" stroke-opacity="0.8" />

    <!-- 45-degree angle telemetry blips -->
    <circle cx="392" cy="120" r="3.5" fill="#5eead4" opacity="0.75" />
    <circle cx="120" cy="392" r="2.5" fill="#34d399" opacity="0.4" />
    <circle cx="392" cy="392" r="2.5" fill="#34d399" opacity="0.4" />
    <circle cx="120" cy="120" r="3.5" fill="#5eead4" opacity="0.75" />
  </g>

  <!-- Ambient Underglow for Central Mark -->
  <circle cx="256" cy="272" r="115" fill="#10b981" fill-opacity="0.16" filter="url(#wmoMasterBloom)" />

  <!-- THE MASTER GLYPH: Aerodynamic W Vector + Upward Ascending Chevron -->
  <g filter="url(#wmoMasterBloom)">
    <!-- Left Wing Blade -->
    <path d="M 124 186
             L 168 186
             L 218 344
             L 182 360
             Z"
          fill="url(#wmoWingLeft)" />

    <!-- Center-Left Connector -->
    <path d="M 182 360
             L 218 344
             L 256 250
             L 242 232
             Z"
          fill="url(#wmoCenterBridge)" />

    <!-- Center-Right Connector -->
    <path d="M 270 232
             L 256 250
             L 294 344
             L 330 360
             Z"
          fill="url(#wmoCenterBridge)" />

    <!-- Right Wing Blade -->
    <path d="M 388 186
             L 344 186
             L 294 344
             L 330 360
             Z"
          fill="url(#wmoWingRight)" />

    <!-- The Ascending Telemetry Chevron (Pure White / Cyan Radiant Arrow) -->
    <path d="M 184 290
             L 208 290
             L 256 202
             L 304 290
             L 328 290
             L 256 168
             Z"
          fill="#ffffff"
          opacity="0.96" />
  </g>

  <!-- The Offer Beacon (Apex 4-Point Target Star & Dual Reticle) -->
  <g transform="translate(256, 128)" filter="url(#wmoBeaconBloom)">
    <!-- Outer Target Pulse Ring -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="#6ee7b7" stroke-width="1.8" stroke-dasharray="5 4" stroke-opacity="0.85" />
    <circle cx="0" cy="0" r="16" fill="none" stroke="#22d3ee" stroke-width="1.2" stroke-opacity="0.5" />
    
    <!-- Radiant 4-Point Star -->
    <path d="M 0 -26
             C 0 -8, 8 0, 26 0
             C 8 0, 0 8, 0 26
             C 0 8, -8 0, -26 0
             C -8 0, 0 -8, 0 -26 Z"
          fill="#ffffff" />
    <!-- Center Emerald Jewel -->
    <circle cx="0" cy="0" r="5" fill="#34d399" />
  </g>

  <!-- Clean Precision Telemetry Label -->
  <text x="256" y="424"
        text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="11"
        font-weight="700"
        letter-spacing="5"
        fill="#34d399"
        opacity="0.55">
    PLACEMENT RADAR // LIVE
  </text>
</svg>